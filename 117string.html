<script>
    // trim : 앞뒤 공백 제거한 새 문자열 리턴
    let a = "      java";
    console.log(a);
    let b = a.trim();
    console.log(b);
    
    let c = "java           "
    let d = c.trim();
    console.log(d);
    
    // 연습 
    let i = "        spring"
    let j = i.trim();
    console.log(j.charAt(j.length - 1)); // g

    let k = [" css  ", "   js   ", "   spring ", "     java ", "  sql"];

// 공백 제거 (trim) + 정렬
let q = k.map(k =>k.trim());
let y = q.sort();
console.log(y); // ["css", "java", "js", "spring", "sql"]
