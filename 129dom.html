<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
<style>
</style>
  </head>
  <div id="box1">
    <div id="box2">
        <h1>Lorem.</h1>
        <p>Lorem, ipsum dolor.</p>
    </div>
  </div>

  <div id="box3">
    <div id="box4">
        <h1>Lorem.</h1>
        <p>Lorem, ipsum dolor.</p>
    </div>
  </div>

  <body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
<script>
    let a = document.querySelector('h1');
    console.log(a);
    let b = document.querySelectorAll('h1');
    console.log(b[1]);
    let c = document.querySelector('#box2');
    console.log(c);
    let d = a.parentElement;
    console.log(d);
    console.log(d.parentElement);
    //
    console.log(a.nextElementSibling);

    let e = a.nextElementSibling;
    console.log(e.previousElementSibling);
    
    //b[1]의 다음 형제
    let zz = b[1].nextElementSibling;
    console.log(zz.nextElementSibling);
    
    let f = document.querySelector("#box2");
    let g = f.children;
    console.log(g[0]);
    console.log(g[1]);

    // 자식 요소 찾기
    let h = document.querySelector('#box3');

    let ha = h.children;
    console.log(ha);
    let hb = ha.children;
    console.log(hb);
    
    
</script>
  </body>
</html>
