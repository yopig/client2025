    <script>
        // 각 프로퍼티를 새로운 줄에 작성하여 코드 읽기 쉬움
        let a = {
            name: 'trump',
            address: 'new york',

                console.log('hello')
            },
                show : () => {

            }
        };

        console.log(a.name);
        a.print();

        let b = {  name: 'trump',
            address: 'new york',
            email: 'gmail',
            age: 77,
            job: 'president',
            ha : () => {
                console.log('hello');
                
            },
            an : () => {
                console.log('안녕하세요');
                
            },
        
        
        };


        b.ha();
        b.an();
