<script>
    let a = {};
    a.printAdd = (a,b) => console.log(a+b);
    a.printSub = (a,b) => console.log(a-b);
    a.printDivide = (a,b) => console.log(a/b);
    a.printmul = (a,b) => console.log(a*b);

    a.printAdd(5,6); //11
    a.printSub(11,7); //4
    a.printDivide(6, 2); // 3
    a.printmul(9,2); // 18
</script>
