<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        h1{
            font-size: 15px;
            height: 20px;
            width: 100px;
            margin: 0px;
            text-align: center;
        }
        h1:nth-child(odd){
            background-color: pink;
        }
        h1:nth-child(even){
            background-color: skyblue;
        }
        .a{
            display: flex;
        }
        #b{
            display : block;
            width :100px;
        }
        div>h2{
            font-size: 15px;
            height: 40px;
            width : 100px;
            text-align: center;
            opacity: 0;
            margin: 0px;
        }
        h2:nth-child(odd){
            background-color: gray;
        }
        h2:nth-child(even){
            background-color: white;
        }
        #aa:hover + {
            background-color: orange;

        }
    </style>
</head>
<body>
    <div>
    <div class="a">
    <h1 id="aa">Lorem </h1>
    <h1 id="ab">Culpa</h1>
    <h1 id="ac">Dignissimos</h1>
    <h1 id="ad">Ullam</h1>
    <h1 id="ae">Iusto</h1>

</div>
<div id="b">
    <h2 >Lorem ipsum</h2>
    <h2 >Minima recusandae</h2>
    <h2>Animi ipsa</h2>
</div>
</div>
</body>
</html>
