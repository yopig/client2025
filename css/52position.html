<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 200px;
            height : 100px;
        }
        div:nth-child(odd){
            background-color: beige;
        }
        div:nth-child(even){
            background-color: skyblue;
        }
        #item2{
            position: relative;
            /* 에서 얼마나 얼머지게 */
            left : 10px;
            top:20px;
            bottom : 30px;
            right : 40px;
        }
        #item4{
            position: fixed;
            left: 500px;
            top : 0px;

        }
    </style>
</head>
<body>
    <div id="item1">1</div>
    <div id="item2">2</div>
    <div id="item3">3</div>
    <br>
    <div id="item4">4
    </div>
