<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container1,
        #container2,
        #container3,
        #container4,
        #container5 {
            width: 500px;
            height: 300px;
            background-color: skyblue;
        }

        #item1,
        #item2,
        #item3,
        #item4,
        #item5 {
            background-color: beige;
            width: 100px;
            height: 50px;
        }

        #item1 {
            position: absolute;
            top: 10px;
            left: 20px;
        }

        #item2 {
            position: absolute;
            right: 0px;
            bottom: 0px;
        }

        #container1 {
            position: relative;
        }

        #container2 {
            position: relative;
        }

        #wa3,
        #wa4 {
            background-color: gold;
            width: 350px;
            height: 120px;
        }

        #item3,
        #item4 {
            position: absolute;
            right: 10px;
            top: 10px;
        }

        #wa3 {
            position: relative;
        }

        #container4 {
            position: relative;
        }

        #item5 {
            position: absolute;
            top: 10px;
            right: 20px;
        }
    </style>

</head>

<body>
    <div id="container1">
        <div id="item1">Lorem.</div>
    </div>
    <hr>
    <div id="container2">
        <div id="item2">Dolore!</div>
    </div>
    <hr>
    <div id="container3">
        <div id="wa3">
            <div id="item3">Quia.</div>
        </div>
    </div>
    <hr>
    <div id="container4">
        <div id="wa4">
            <div id="item4">In?</div>
        </div>
    </div>
    <hr>
    <div id="container5">
        <div id="item5">Possimus!</div>
    </div>
    <hr>
</body>

</html>
