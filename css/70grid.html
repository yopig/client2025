<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
<style>
    .container{
        border: solid 2px black;
    }
    
    .a{
        background-color: blue;
    }
    .b{
        background-color: orange;
    }
    .c{
        background-color: violet;
    }   
    .d{
        background-color: rosybrown;
    }
    .e{
        background-color: skyblue;
    }
    .f{
        background-color: gray;
    }
</style>
  </head>
  <body>
    <div class="container">
        <div class="row">
            <div class="col-12 a">
                HEADER
            </div>
            <div class="col-12 col-md-6 order-md-3 order-lg-1 col-lg-4 b order-3">
                FEATUER
            </div>
            <div class="col-12 col-md-6 order-md-5 col-lg-4 c order-lg-2 order-5">
                FEATURE
            </div>
            <div class="col-12 col-md-6 order-md-4 col-lg-4 d order-lg-3 order-4">                    
                FEATURE
            </div>
            <div class="col-12 col-md-6 order-md-2 order-lg-4 col-lg-12 order-2 e">
                SIGN UP
            </div>
            <div class="col-12 order-md-1 oder-1 order-lg-5 f ">
                CONTENT
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
