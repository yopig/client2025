<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
<style>
</style>
  </head>

  <body>
    <button id="btn1">1</button>
    <button id="btn2">2</button>
    <button id="btn3">3</button>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
<script>
    let b1  = document.querySelector('#btn1')
    let b2  = document.querySelector('#btn2')
    let b3  = document.querySelector('#btn3')

    b1.onclick = function(){
        console.log('첫번째 버튼 클릭 1');
    }
    b1.onclick = function(){
        console.log('첫번째 버튼 클릭 2');
    }
    let func1 = function() {
        console.log('첫번째 버튼 클릭됨1');
    }
    let func2 = function() {
        console.log('첫번째 버튼 클릭됨2');
        
    }
    b1.onclick = function(){
        func1();
        func2();
    }
    b2.addEventListener('click', function() {
        console.log('두번째 버튼 클릭1');
        
    });
    b2.addEventListener('click', function() {
        console.log('두번째 버튼 클릭2');
    });

    //addeventlisterner 사용
    //세번째 버튼 클릭시 실행되는 3개 함수
    b3.addEventListener('click', function() {
        console.log('세번째 버튼 클릭1');
    });
    b3.addEventListener('click', function() {
        console.log('세번째 버튼 클릭2');
    });
    b3.addEventListener('click', function() {
        console.log('세번째 버튼 클릭3');
    });
</script>
  </body>
</html>
