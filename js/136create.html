<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <style>
    </style>
</head>

<body>
    <div id="box1">1</div>
    <button id="btn1">박스2에 추가</button>
    <div id="box2">2</div>

    <button id="btn2">append 박스3에 마지막</button>
    <button id="btn3">prepend 박스3에 첫번째</button>
    <button id="btn4">after 박스3에 다음 형제</button>
    <button id="btn5">before 박스3에 이전 형제</button>
    <div id="box3">3</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
    <script>
        let a = document.querySelector('#box1');
        let h = document.createElement('h1');
        a.append(h)
        let btn1 = document.querySelector('#btn1')
        btn1.addEventListener("click", function () {
            let p = document.querySelector('p');
            let b2 = document.querySelector('#box2');
            b2.append(p);
        });
        //append 박스3에 마지막
document.querySelector('#btn2').addEventListener('click', function(){
    let elem = document.createElement('h3')
    document.querySelector('#box3').append(elem);
});

        //prepend 박스3에 첫번째
        document.querySelector('#btn3').addEventListener('click', function(){
    let elem = document.createElement('h4')
    document.querySelector('#box3').prepend(elem);
});

        //after 박스3에 다음 형제
        document.querySelector('#btn4').addEventListener('click', function(){
    let elem = document.createElement('h5')
    document.querySelector('#box3').after(elem);
});
        //before 박스3에 이전 형제
        document.querySelector('#btn5').addEventListener('click', function(){
    let elem = document.createElement('h6')
    document.querySelector('#box3').before(elem);
});
    </script>
</body>

</html>
