<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
<style>
</style>
  </head>
  <body>
  <div style = 'display: flex; gap : 10px;'>
    <div style = 'flex : 1;'>
        <input type="text" id="input1"><button id="btn1">+</button>
        <hr>
        <ul id="list1"></ul>
    </div>
    <div style = 'flex : 1;'>
        <input type="text" id="input2"><button id="btn2">+</button>
        <hr>
        <ul id="list2"></ul>
  </div>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
<script>
    document.querySelector('#btn1').addEventListener('click', function(){
        let v = document.querySelector('#input1').value;
        let l = document.createElement('li');
        l.textContent = v;
        document.querySelector('#list1').prepend(l);
    })
    document.querySelector('#btn2').addEventListener('click', function(){
        let v = document.querySelector('#input2').value;
        document.querySelector('#list2').innerHTML+=`
        <li>${v}</li>
        `;
    })
</script>
  </body>
</html>
