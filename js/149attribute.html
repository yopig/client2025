<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
<style>
</style>
  </head>
  <body>
    <img src="../html/사자.jpeg" alt="사자" id="img1" title="라이온">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
<script>
    // src attribute 읽기
    let s1 = document.querySelector("#img1").getAttribute("src");
    console.log(s1);

    document.querySelector("#img1").setAttribute("src","../html/고양이.jpg");
    // Src 프로퍼티    
    let s2 = document.querySelector('#img1').src;
    console.log(s2);

    document.querySelector('#img1').src = '../html/강아지.jpeg';
    
    //alt, title attribute를 property를 사용해서 바꾸기
    let i = document.querySelector('#img1');
    i.setAttribute('src','../html/닭.jpeg')
    document.querySelector('#img').src = '..' 

</script>
  </body>
</html>
