<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
<style>
    .done {
        text-decoration-line: line-through;
    }
</style>
  </head>
  <body>
    <ul id="list1">
        <li>Lorem.
            <hr>
            <button>완료</button></li>
        <li>Architecto!<button>완료</button></li>
        <li>Aut?<button>완료</button></li>
        <li>Impedit.<button>완료</button></li>
        <li>Repudiandae!<button>완료</button></li>
        <li>Ab.<button>완료</button></li>
        <li>Magnam.<button>완료</button></li>
        <li>Dignissimos!<button>완료</button></li>
        <li>Ullam.<button>완료</button></li>
        <li>Eaque.<button>완료</button></li>
    </ul>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
<script>
    let b = document.querySelectorAll('button');
    for (let i = 0; i < b.length; i++){
        b[i].addEventListener('click',() => {
            b[i].parentElement.classList.toggle('done')
            if (b[i].parentElement.classList.contains('done')){
                b[i].textContent = '취소';
            }else {
                b[i].textContent = '완료';
            }
        })
    }
</script>
  </body>
</html>
