<script>
    let a;
    a = 3;
    console.log(a);

    let b;
    console.log(b); //umdefined
    
    b=3
    console.log(b);
    
    b="hello"
    console.log(b);
    
    let c;
    console.log(c + 5);
    
    let d; //undefined
    let e = d+5; //NaN

    console.log(d ? "트루" : "펄시" );
    console.log(e ? "트루" : "펄시" );

    let f;
    console.log(f);
    f = undefined;
    console.log(f);

    let g = 3;
    console.log(g / 0);
    let h = -5;
    console.log(h / 0);
    let i = 5;
    console.log(i / -0);
    let j = 5 / 0;
    console.log(j);
    console.log(j - 100000000000);
    let k = 5;
    console.log(k % 0);

    // 자바 스크립트에서 사용할수 있는 가장큰 정수

    console.log(l);
