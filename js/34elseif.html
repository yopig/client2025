<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <style>
    </style>
</head>

<body>
    점수 : <input type="text" id="input1">
    <br>
    <button id="btn1" class="btn btn-primary">등급확인</button>
    <hr>
    <h3 id="result"></h3>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
    <script>
        // 90 <= 점수 <= 100 : A
        // 80 <= 점수 < 90 : B
        // 70 ~ 80 c
        // 60~ 70 d
        // 60 ~ 0 f
        // 음수면 잘못입력하셨습니다.
        function check() {
            let re = document.querySelector("#input1").value;
            re = Number(re);

            if (re >= 90 && re <= 100) {
                document.querySelector("#result").innerText = "A";
            }
            else if (re >= 80 && re < 90) {
                document.querySelector("#result").innerText = "B";
            }
            else if (re >= 70 && re < 80) {
                document.querySelector("#result").innerText = "C";
            }
            else if (re >= 60 && re < 70) {
                document.querySelector("#result").innerText = "D";
            }
            else if (re >= 0 && re < 60) {
                document.querySelector("#result").innerText = "F";
            }
            else {

                document.querySelector("#result").innerText = "잘못입력하셨습니다";

            }
        }

        document.querySelector("#btn1").onclick = check;
    </script>
</body>

</html>
