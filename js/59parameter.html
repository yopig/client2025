<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
<style>
</style>
  </head>
  <body>
    <input type="number" id="input1" value="0">
    <input type="number" id="input2" value="0">
    <button id="btn1" class="btn btn-primary">+</button>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <hr>
    <h3 id="result"></h3>
<script>
    function printAdd(a, b){
        console.log("printadd 실행됨")
        //console에 더한 값 출력하기기
        //document.querySelector('#result') = printAdd;
        console.log(a + b); 
    }
    function action(){
        let a = document.querySelector('#input1').value;
        let b = document.querySelector('#input2').value;
        a = Number(a);  
        b = Number(b);
        printAdd(a, b);
    }
    document.querySelector('#btn1').onclick = action;
</script>
  </body>
